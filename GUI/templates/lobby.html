<!DOCTYPE html>
<html>
<head>
    <title>Chess Overdrive</title>
    <link rel="stylesheet" href="/static/style.css">
</head>

<body style="max-width:800px;margin:auto;padding:40px;">

<h1>♟ Chess Overdrive - Lobby</h1>

<form action="/create_game" method="post" style="margin-bottom:30px;">
    <button type="submit" style="font-size:1.1em;padding:8px 16px;">
        ➕ Créer une nouvelle partie
    </button>
</form>

<h2>Parties en cours</h2>

{% if games %}
<table border="1" cellpadding="8" cellspacing="0">
    <tr>
        <th>ID</th>
        <th>Créée</th>
        <th>Joueurs</th>
        <th></th>
    </tr>

    {% for gid, info in games.items() %}
    <tr>
        <td>{{ gid }}</td>
        <td>{{ info.created_at.strftime("%H:%M:%S") }}</td>
        <td>{{ info.player_count }}</td>
        <td>
            <form action="/join/{{ gid }}" method="post">
                <button type="submit">Rejoindre</button>
            </form>
        </td>
    </tr>
    {% endfor %}
</table>
{% else %}
<p>Aucune partie en cours.</p>
{% endif %}

</body>
</html>
