{% if not state %}
<div>En attente moteur...</div>
{% else %}
<h2>Overdrive</h2>
{% for pid, pdata in state["players"].items() %}
<div class="overdrive-bar">
    <div style="background:{{ 'orange' if loop.first else 'purple' }};
                width:{{ [pdata.overdrive, 100]|min }}%; height:20px;"></div>
    <span><b>{{ pdata.username }}</b> : {{ pdata.overdrive|round(1) }}%</span>
</div>
{% endfor %}
{% endif %}
